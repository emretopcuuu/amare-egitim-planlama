name: Cloudflare Pages (egitimtakvimi)

# Sayfalar/dosyalar Cloudflare Pages'ten sunulur (oneteam-egitimtakvimi projesi).
# Netlify fonksiyonları + zamanlanmış işler Netlify'da kalır; cf-pages/functions/_middleware.js
# /.netlify/functions/* ve /d/* isteklerini oraya vekil eder. Netlify de her push'ta
# kendi kopyasını kurmaya devam eder (yedek + fonksiyonlar).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Derle
        run: npm run build
        env:
          VITE_RECAPTCHA_V3_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_V3_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      # 404.html kökte durursa Pages siteyi tek-sayfa uygulaması SAYMAZ (/takvim → 404).
      # Kaldırınca bilinmeyen yollar index.html'e düşer (Netlify'daki /* → /index.html).
      - name: Cloudflare dosyalarını ekle (_headers, _routes.json) + SPA modu
        run: |
          cp cf-pages/static/_headers cf-pages/static/_routes.json dist/
          rm -f dist/404.html
      - name: Yayınla
        working-directory: cf-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy ../dist --project-name oneteam-egitimtakvimi --branch main --commit-dirty=true
